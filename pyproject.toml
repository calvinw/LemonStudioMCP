[project]
name = "lemon-studio-mcp"
version = "0.1.0"
description = "MCP server for Lemon Studio: drives the app over its JSON-RPC control socket."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lemon-studio-mcp = "lemon_studio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemon_studio_mcp"]
